<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style/login_sign_up.css">
</head>
<body id = "login_body">
    <header id = "login_header">
        <h1 id = "login_title">Login</h1>
    </header>
    <section id="login_section">
        <form id="login_form">
            <label id="login_username">Username:</label>
            <input id="username_input" type="text">
            
            <label id="password_label">Password:</label>
            <input id="password_input" type="password">

            <button id="login_submit_btn" type="submit">Submit</button>
        </form>
    </section>
    <footer id="login_footer">
        <a id="no_account" href="sign_up.html">No Acount? Sign Up!</a>
    </footer>
    
</body>
</html>
