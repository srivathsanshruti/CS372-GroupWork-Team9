<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style/login_sign_up.css">
</head>
<body id="sign_up_body">
    <header id="sign_up_header">
        <h1 id="sign_up_title">Sign Up</h1>
    </header>
    <section id="sign_up_section">
        <form id="sign_up_form">
            <label id="sign_up_username">Username:</label>
            <input id="username_input" type="text">

            <label id="sign_up_password">Password:</label>
            <input id="password_input" type="password">

            <label id="confirm_label">Confirm Password:</label>
            <input id="confirm_input" type="password">

            <button id="sign_up_submit_btn" type="submit">Submit</button>
        </form>
    </section>
    <footer id="sign_up_footer">
        <a id="have_account" href="login.html">Already Have an Acount? Login!</a>
    </footer>
</body>
</html>
